<div class="container">
    <br>
    <h5>Customer Form</h5>
    <form (ngSubmit)="onSubmit()">
        <div class="row py-3">
            <div class="col">
                <input type="number" class="form-control" placeholder="Customer Id" name="customerId"
                    [(ngModel)]="CustomerDetails.CustomerId" [disabled]="isUpdate">
            </div>
            <div class="col">
                <label for="customerName" class="form-label">Customer Name</label>
                <input type="text" class="form-control" placeholder="Customer Name" name="customerName"
                    [(ngModel)]="CustomerDetails.CustomerName" name="CustomerName">
            </div>
        </div>
        <div class="row py-3">
            <div class="col">
                <label for="Email" class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="Email" name="Email"
                    [(ngModel)]="CustomerDetails.CustomerEmail" name="CustomerEmail">
            </div>
            <div class="col">
                <label for="CustomerPhoneNumber" class="form-label">Customer Phone Number</label>
                <input type="text" class="form-control" placeholder="Customer Phone Number" name="CustomerPhoneNumber"
                    [(ngModel)]="CustomerDetails.CustomerPhone" name="CustomerPhone">
            </div>
        </div>
        <div class="row py-3">
            <div class="col">
                <label for="RegistrationDate" class="form-label">Registration Date</label>
                <input type="datetime" class="form-control" placeholder="Registration Date" name="RegistrationDate"
                    [(ngModel)]="CustomerDetails.RegistrationDate" name="CustomerRegistrationDate">
            </div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg ">Add</button>
    </form>
</div>
